name: GUI Release

# main 推送即构建并发布 Release；也支持手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 同名工作流的旧任务在 main 推送后一律中止
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读；发布 Release 的 job 单独提权
permissions:
  contents: read

env:
  APP_NAME: Ceobe
  MAIN_CLASS: im.xrl.ceobe.gui.Launcher

jobs:
  # ---------- 读取根 pom.xml 的 CalVer 版本号（唯一权威，CI 只读不写）----------
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      pkg_version: ${{ steps.read.outputs.pkg_version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure Maven mirror (Aliyun)
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Public</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          XML

      - name: Read CalVer version from root pom.xml
        id: read
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(mvn -N -q help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null)"
          VERSION="$(printf '%s\n' "$RAW" | tr -d '\r' \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | grep -E '^[0-9][0-9A-Za-z._-]*$' | tail -n1 || true)"
          [ -n "$VERSION" ] || { echo "::error::无法从根 pom.xml 解析出版本号（mvn 输出：$RAW）"; exit 1; }

          # jpackage（macOS）只接受 1-3 段数字、且首段不为 0（JDK-8380634，JDK 27 才放宽该限制），
          # 故安装包版号取 CalVer 去掉 -HH 后缀后的前三段。
          PKG="${VERSION%%-*}"
          if [[ ! "$PKG" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]]; then
            echo "::error::包版号 '$PKG' 不合法：jpackage 要求 1-3 段数字、不以 0 开头（源版本 '$VERSION'）"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION（安装包版号 $PKG，Release tag v$VERSION）"

  # ---------- 三平台打包 ----------
  package:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: "Windows (.exe)",  kind: exe,       artifact: ceobe-windows-exe }
          # macOS runner 为 arm64：容量紧张时排队偏长，属 GitHub 侧限制，配置无法消除
          - { os: macos-latest,   label: "macOS (.dmg)",    kind: dmg,       artifact: ceobe-macos-dmg }
          - { os: ubuntu-24.04,   label: "Linux (AppImage)", kind: appimage, artifact: ceobe-linux-appimage }
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure Maven mirror (Aliyun)
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Public</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          XML

      - name: Build (skip tests)
        run: mvn -B -DskipTests package

      - name: Stage application jar
        shell: bash
        run: |
          rm -rf staging && mkdir -p staging
          cp ceobe-gui/target/ceobe-gui.jar staging/

      # ---------- Windows: .exe（jpackage 需要 WiX）----------
      - name: Ensure WiX (Windows)
        if: matrix.kind == 'exe'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }

      - name: jpackage → .exe
        if: matrix.kind == 'exe'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.pkg_version }}
        run: |
          jpackage --type exe --name "$env:APP_NAME" --app-version "$env:APP_VERSION" `
            --input staging --main-jar ceobe-gui.jar --main-class "$env:MAIN_CLASS" `
            --dest dist --java-options "-Dfile.encoding=UTF-8" `
            --win-menu --win-shortcut --win-dir-chooser

      # ---------- macOS: .dmg ----------
      - name: jpackage → .dmg
        if: matrix.kind == 'dmg'
        env:
          APP_VERSION: ${{ needs.version.outputs.pkg_version }}
        run: |
          jpackage --type dmg --name "$APP_NAME" --app-version "$APP_VERSION" \
            --input staging --main-jar ceobe-gui.jar --main-class "$MAIN_CLASS" \
            --dest dist --java-options "-Dfile.encoding=UTF-8"

      # ---------- Linux: app-image → AppImage ----------
      - name: jpackage → app-image
        if: matrix.kind == 'appimage'
        env:
          APP_VERSION: ${{ needs.version.outputs.pkg_version }}
        run: |
          jpackage --type app-image --name "$APP_NAME" --app-version "$APP_VERSION" \
            --input staging --main-jar ceobe-gui.jar --main-class "$MAIN_CLASS" \
            --dest dist --java-options "-Dfile.encoding=UTF-8"

      - name: Wrap AppImage (Linux)
        if: matrix.kind == 'appimage'
        env:
          APP_VERSION: ${{ needs.version.outputs.pkg_version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

          rm -rf AppDir
          mkdir -p AppDir/usr
          cp -r "dist/${APP_NAME}/." AppDir/usr/

          # 图标：复用 jpackage 生成的 PNG，避免依赖 ImageMagick
          ICON="$(find "dist/${APP_NAME}/lib" -maxdepth 1 -name '*.png' -print -quit)"
          [ -n "$ICON" ] || ICON="$(find "dist/${APP_NAME}" -name '*.png' -print -quit)"
          [ -n "$ICON" ] || { echo "找不到 jpackage 图标"; exit 1; }
          cp "$ICON" AppDir/ceobe.png

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Ceobe" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/ceobe.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Ceobe
          Comment=Minecraft 私有服务器编排引擎
          Exec=Ceobe
          Icon=ceobe
          Categories=Game;Utility;
          Terminal=false
          EOF

          # appimagetool：官方源优先，失败回退旧仓库
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            || curl -fsSL -o appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/ceobe-${APP_VERSION}-x86_64.AppImage"

      - name: List artifacts
        shell: bash
        run: ls -la dist

      - name: Upload artifact
        # Node 24 版本：upload-artifact 为 v6（v5 仍默认 node20）
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ---------- 汇总产物 → 发布 GitHub Release ----------
  release:
    name: Publish Release
    needs: [ version, package ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all packages
        # Node 24 版本：download-artifact 为 v7（与 upload-artifact 的 v6 不对齐）
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # 标题与正文复用本次 commit message
          TITLE="$(git log -1 --pretty=%s)"
          BODY="$(git log -1 --pretty=%b)"
          echo "发布 $TAG —— $TITLE"
          ls -la dist

          # 同名 Release/tag 已存在则删除重建（同日多次推送幂等收敛）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # 兜底：清理「有 tag 但无 Release」的残留 tag
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "$GITHUB_SHA" \
            --latest \
            dist/*
